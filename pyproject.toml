[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dwellcall"
version = "0.1.0"
description = "Real estate lead intelligence with optional voice consultations"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.18.0,<2",
    "email-validator>=2.3.0,<3",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langchain-openai==1.7.3",
    "langgraph==1.2.19",
    "pydantic-settings==2.14.2",
    "phonenumbers==9.0.42",
    "psycopg[binary]>=3.3.2,<4",
    "retell-sdk==6.2.16",
    "SQLAlchemy>=2.0.46,<2.1",
    "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = ["mypy==2.3.0", "pytest==9.1.1", "ruff==0.16.1"]

[tool.setuptools]
package-dir = {"" = "apps/backend/src"}

[tool.setuptools.packages.find]
where = ["apps/backend/src"]

[tool.setuptools.package-data]
dwellcall = ["py.typed"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["dwellcall"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["dwellcall"]
mypy_path = "apps/backend/src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
